<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учёт времени</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">Рабочее время</p>
        <h1>Учёт времени</h1>
      </header>

      <div id="error-area" class="error-area" role="alert" hidden></div>

      <section class="panel" aria-labelledby="employees-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Команда</p>
            <h2 id="employees-heading">Сотрудники</h2>
          </div>
        </div>
        <form id="employee-form" class="inline-form">
          <label class="sr-only" for="employee-name">Имя сотрудника</label>
          <input id="employee-name" name="name" type="text" maxlength="100" placeholder="Имя сотрудника" required>
          <button type="submit">Добавить</button>
        </form>
        <div id="employees-list" class="employees-list" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="report-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Сводка и записи</p>
            <h2 id="report-heading">Отчёт</h2>
          </div>
        </div>
        <form id="report-form" class="report-filters">
          <label>
            <span>С</span>
            <input id="date-from" name="date_from" type="date" required>
          </label>
          <label>
            <span>По</span>
            <input id="date-to" name="date_to" type="date" required>
          </label>
          <label class="employee-filter">
            <span>Сотрудник</span>
            <select id="employee-filter">
              <option value="">Все сотрудники</option>
            </select>
          </label>
          <button type="submit">Показать</button>
        </form>

        <h3>Итоги</h3>
        <div class="table-wrap">
          <table id="summary-table">
            <thead>
              <tr><th>Сотрудник</th><th>Записей</th><th>Всего</th></tr>
            </thead>
            <tbody id="summary-body"></tbody>
          </table>
        </div>

        <h3 class="entries-heading">Записи</h3>
        <p id="entries-empty" class="empty-state" hidden>Нет записей за выбранный период</p>
        <div id="entries-table-wrap" class="table-wrap">
          <table id="entries-table">
            <thead>
              <tr><th>Сотрудник</th><th>Задача</th><th>Начало</th><th>Конец</th><th>Длительность</th></tr>
            </thead>
            <tbody id="entries-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
